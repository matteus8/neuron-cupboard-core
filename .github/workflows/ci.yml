name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Subsystem Verification & Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Toolchain & Protobuf Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler clang
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify Code Generation
        run: |
          make proto
          git diff --exit-code || (echo "ERROR: Uncommitted protobuf generated changes detected." && exit 1)

      - name: Run Test Suites & E2E Swarm Simulation
        run: |
          make test

      - name: Run Gateway Throughput Benchmarks
        run: |
          make bench

      - name: Build Gateway Production Binary
        run: |
          make build
          ls -lh bin/gateway
