name: CI Quality Gate & Release Pipeline

on:
  push:
    branches: [ main, 'release/**', 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Security Scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang
          python3 -m pip install -q bandit
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run C Static Analysis (cppcheck & hardened clang)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction -Iproto/c -Ifirmware/include proto/c/ firmware/src/
          make sast-c

      - name: Run Python SAST (bandit)
        run: |
          make sast-python

      - name: Run Go SAST (govulncheck & gosec)
        run: |
          make sast-go

  build-and-verify:
    name: Subsystem Verification & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Toolchain & Protobuf Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler clang
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Verify Code Generation
        run: |
          make proto
          make test-proto

      - name: Run Test Suites & E2E Swarm Simulation
        run: |
          make test

      - name: Run Gateway Throughput Benchmarks
        run: |
          make bench

      - name: Verify Build
        run: |
          make build
          ls -lh bin/gateway
          ls -lh bin/bamboo_node.uf2

      - name: Archive Firmware Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bamboo-node-firmware
          path: bin/bamboo_node.uf2
          if-no-files-found: error

  release:
    name: Tag & Release Standalone Native Binaries
    needs: [sast, build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Build Cross-Platform Standalone Binaries & Firmware
        run: |
          make release-build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            bin/bamboo_node.uf2
            bin/gateway-linux-arm64
            bin/gateway-linux-amd64
            bin/gateway-darwin-arm64
            bin/checksums.sha256
          body: |
            ### Release Artifacts & Target Hardware Quick Reference

            | Artifact File | Target Hardware | Execution Role & How to Install |
            | :--- | :--- | :--- |
            | **`bamboo_node.uf2`** | **Raspberry Pi Pico H** (RP2040 MCU) | **Optical Transmitter:** Hold `BOOTSEL` while connecting Pico via USB (`RPI-RP2` drive). Drag & drop this file. Pico auto-reboots and emits 850nm Manchester pulses on GP15. |
            | **`gateway-linux-arm64`** | **Raspberry Pi 5** (64-bit ARM) | **Tactical Relay Daemon:** Bridges physical optical mesh packets to Eclipse Zenoh networks. Run standalone or enable via `deploy/systemd/neuron-gateway.service`. |
            | **`gateway-linux-amd64`** | **x86_64 Workstations / Servers** | **Tactical Command Post Bridge:** Ingests swarm state vectors on tactical edge servers and Linux ground stations. |
            | **`gateway-darwin-arm64`** | **Apple Silicon Mac** (macOS) | **Local Telemetry & Dev Bridge:** Local simulation and real-time monitoring on macOS workstations. |
            | **`checksums.sha256`** | All Platforms | **Verification Manifest:** Cryptographic SHA-256 hashes for all release artifacts (`sha256sum -c checksums.sha256`). |

            > [!TIP]
            > **Panda Edge Compute Runtime (`runtime/`):** Runs on the **Raspberry Pi 5** host OS (requires Python 3 + OpenCV). It ingests video from the Camera Module 3 NoIR, detects optical centroids, decodes pulses, and updates swarm consensus. Launch via `python3 -m runtime.panda.engine` or install the systemd unit `deploy/systemd/panda-runtime.service`.
          generate_release_notes: false
          draft: false
          prerelease: false
