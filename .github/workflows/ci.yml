name: CI Quality Gate & Release Pipeline

on:
  push:
    branches: [ main, 'release/**', 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Security Scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang
          python3 -m pip install -q bandit
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run C Static Analysis (cppcheck & hardened clang)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction -Iproto/c -Ifirmware/include proto/c/ firmware/src/
          make sast-c

      - name: Run Python SAST (bandit)
        run: |
          make sast-python

      - name: Run Go SAST (govulncheck & gosec)
        run: |
          make sast-go

  build-and-verify:
    name: Subsystem Verification & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Toolchain & Protobuf Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler clang
          python3 -m pip install -q -r runtime/requirements.txt
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Verify Code Generation
        run: |
          make proto
          make test-proto

      - name: Run Test Suites & E2E Swarm Simulation
        run: |
          make test

      - name: Run Gateway Throughput Benchmarks
        run: |
          make bench

      - name: Verify Build
        run: |
          make build
          make package-runtime
          make package-runtime-airgap
          ls -lh bin/gateway
          ls -lh bin/gcs
          ls -lh bin/bamboo_node.uf2
          ls -lh bin/panda-runtime.tar.gz
          ls -lh bin/panda-runtime-airgap.tar.gz

      - name: Archive Firmware & Runtime Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bamboo-node-payload-artifacts
          path: |
            bin/bamboo_node.uf2
            bin/panda-runtime.tar.gz
            bin/panda-runtime-airgap.tar.gz
          if-no-files-found: error

  release:
    name: Tag & Release Standalone Native Binaries
    needs: [sast, build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Build Cross-Platform Standalone Binaries & Firmware
        run: |
          make release-build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            bin/bamboo_node.uf2
            bin/panda-runtime.tar.gz
            bin/panda-runtime-airgap.tar.gz
            bin/gateway-linux-arm64
            bin/gateway-linux-amd64
            bin/gateway-darwin-arm64
            bin/gateway-windows-amd64.exe
            bin/gcs-linux-arm64
            bin/gcs-linux-amd64
            bin/gcs-darwin-arm64
            bin/gcs-windows-amd64.exe
            bin/checksums.sha256
            scripts/gcs_server.py
          body: |
            ### v0.5.0: Physical Optical Telemetry & Hardware Consensus Verified

            **Milestone Summary:**
            * **Physical Over-The-Air Verification:** 100% frame recovery over physical 850nm optical carrier (consecutive sequences 53 -> 59, 157 -> 210+) with zero packet loss, valid CRC-8 checksums, and locked bearing angles.
            * **Hardware Exposure Synchronization:** Synchronized RP2040 microsecond transmitter timing at 15 Baud to the Sony IMX708 NoIR camera's 29.9 FPS integration window (delta < 110 us).
            * **Optical Glare & Noise Rejection:** Calibrated optical acceptance window (`threshold=175`, `min_area=8px`, `max_area=2000px`) with 3x3 morphological opening, completely rejecting table reflection blooms and CMOS shot noise.
            * **Physical Line-of-Sight ("Book Test") Proved:** Real-time optical obstruction detection and sub-4-second automatic recovery verified.
            * **Standalone Cross-Platform GCS:** Added zero-dependency standalone Python GCS server (`scripts/gcs_server.py`) with embedded dark-mode polar radar HUD.

            ### Target Payloads & Hardware Roles

            | Hardware Role | Physical Hardware | Release Artifacts to Deploy | Description & Execution |
            | :--- | :--- | :--- | :--- |
            | **Optical Emitter Node** | **Raspberry Pi Pico H** (RP2040 MCU) | **`bamboo_node.uf2`** | **Transmitter Firmware:** Hold `BOOTSEL` button while connecting Pico via USB (`RPI-RP2` drive). Drag & drop `bamboo_node.uf2`. Microcontroller auto-reboots and emits 850nm Manchester pulses on GP15. |
            | **Optical Receiver & Gateway Node** | **Raspberry Pi 5** (Raspberry Pi OS Lite 64-bit) | **`panda-runtime.tar.gz`**<br>*(or `panda-runtime-airgap.tar.gz`)*<br>+<br>**`gateway-linux-arm64`** | **Runs Both Services On-Device:**<br>1. `panda-runtime`: Ingests Camera Module 3 NoIR frames, tracks 850nm light blobs with OpenCV, and decodes Manchester pulses into 6-byte frames.<br>2. `gateway-linux-arm64`: Translates decoded frames into Protobuf and relays across Zenoh over IP.<br>*Running `sudo ./install.sh --gateway-ip <IP> --gateway-port 9092` auto-configures and starts the systemd service.* |
            | **Ground Control Station (GCS) / C2** | **Tactical Laptop / PC / Mac** (Windows / Linux / macOS) | **`gcs_server.py`**<br>*(or `gcs-windows-amd64.exe` / `gcs-linux-amd64`)* | **Tactical Web Dashboard:** Real-time Head-Up Display (HUD) displaying optical bearing radar, swarm consensus, and live wire stream on `http://localhost:8080`.<br>Run `python gcs_server.py` on laptop and open `http://localhost:8080`. |
            | **Tactical Network Gateway** | **Workstations / Servers** (Windows / Linux / macOS) | **`gateway-windows-amd64.exe`**<br>**`gateway-linux-amd64`**<br>**`gateway-darwin-arm64`** | **Tactical Workstation Relay:** Ingests swarm state vectors on ground stations, command post laptops, or C2 servers. |

            ### Quick Deployment Guide

            * **Raspberry Pi 5 Zero-Touch Setup:** The Pi 5 is the primary edge receiver node. Extract `panda-runtime.tar.gz` and run `sudo ./install.sh --gateway-ip <LAPTOP_IP> --gateway-port 9092`. It installs dependencies (including `libcamera-tools`), configures systemd, and starts the runtime automatically.
            * **Operating System for Raspberry Pi 5:** Use **Raspberry Pi OS Lite (64-bit, Debian Bookworm)**. The headless Lite edition eliminates desktop bloat and provides kernel-level drivers for the RP1 southbridge, VideoCore ISP, and Camera Module 3 NoIR (`libcamera`).
            * **Tactical GCS on Laptop (Surface / PC / Mac):**
              - **Python (Universal):** Download `gcs_server.py` and run `python gcs_server.py`. Open `http://localhost:8080`.
              - **Windows Binary:** Download `gcs-windows-amd64.exe` and execute `.\gcs-windows-amd64.exe --listen 0.0.0.0:9092 --http 0.0.0.0:8080`.
              - **Linux/macOS Binary:** Download `gcs-linux-amd64`, run `chmod +x gcs-linux-amd64`, and execute `./gcs-linux-amd64 --listen 0.0.0.0:9092 --http 0.0.0.0:8080`.
              - Open `http://localhost:8080` in any web browser.
            * **Next Milestone:** Demoing and focusing on Mule Zenoh and the Tactical Network Gateway (`gateway/`), publishing swarm consensus states across constrained IP networks.
            * **CLI Flags & Help:** Pass `--help` to any binary or installer script (`./gateway-<platform> --help`, `./gcs-<platform> --help`, or `sudo ./install.sh --help`) to view port bindings, metrics endpoints, and options.
            * **Integrity Verification:** Check downloaded files with `sha256sum --ignore-missing -c checksums.sha256`.
          generate_release_notes: false
          draft: false
          prerelease: false
