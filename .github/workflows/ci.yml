name: CI Quality Gate & Release Pipeline

on:
  push:
    branches: [ main, 'release/**', 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Security Scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang
          python3 -m pip install -q bandit
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run C Static Analysis (cppcheck & hardened clang)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction -Iproto/c -Ifirmware/include proto/c/ firmware/src/
          make sast-c

      - name: Run Python SAST (bandit)
        run: |
          make sast-python

      - name: Run Go SAST (govulncheck & gosec)
        run: |
          make sast-go

  build-and-verify:
    name: Subsystem Verification & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Toolchain & Protobuf Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler clang
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Verify Code Generation
        run: |
          make proto
          make test-proto

      - name: Run Test Suites & E2E Swarm Simulation
        run: |
          make test

      - name: Run Gateway Throughput Benchmarks
        run: |
          make bench

      - name: Verify Build
        run: |
          make build
          make package-runtime
          ls -lh bin/gateway
          ls -lh bin/bamboo_node.uf2
          ls -lh bin/panda-runtime.tar.gz

      - name: Archive Firmware & Runtime Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bamboo-node-payload-artifacts
          path: |
            bin/bamboo_node.uf2
            bin/panda-runtime.tar.gz
          if-no-files-found: error

  release:
    name: Tag & Release Standalone Native Binaries
    needs: [sast, build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'

      - name: Install ARM Embedded Toolchain & Raspberry Pi Pico SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          git -C /opt/pico-sdk submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Build Cross-Platform Standalone Binaries & Firmware
        run: |
          make release-build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            bin/bamboo_node.uf2
            bin/panda-runtime.tar.gz
            bin/gateway-linux-arm64
            bin/gateway-linux-amd64
            bin/gateway-darwin-arm64
            bin/checksums.sha256
          body: |
            ### Target Hardware Payloads & Deployment Quick Reference

            | Target Hardware | Artifact File | Execution Role & Deployment |
            | :--- | :--- | :--- |
            | **Raspberry Pi Pico H** (RP2040 MCU) | **`bamboo_node.uf2`** | **Optical Emitter Firmware:** Hold `BOOTSEL` button while connecting Pico via USB (`RPI-RP2` drive). Drag & drop `bamboo_node.uf2`. The Pico auto-reboots and broadcasts 850nm Manchester pulse trains on GP15. |
            | **Raspberry Pi 5** (Raspberry Pi OS Lite 64-bit) | **`panda-runtime.tar.gz`** | **Panda Vision & Swarm Engine:** Extract on Pi 5: `tar -xzf panda-runtime.tar.gz && sudo ./install.sh`. Configures zero-bloat OpenCV blob tracking, hardware VideoCore ISP ingest, bench tools, and auto-starts `panda-runtime.service`. |
            | **Raspberry Pi 5** (Raspberry Pi OS Lite 64-bit) | **`gateway-linux-arm64`** | **Tactical Zenoh Relay Bridge:** Bridges optical mesh packets to Eclipse Zenoh for external telemetry/C2. Install using `sudo ./install_gateway.sh gateway-linux-arm64` (or let `./install.sh` auto-detect it). |

            > [!NOTE]
            > **Auxiliary Tactical C2 & Workstation Builds:** `gateway-linux-amd64` (x86_64 Linux) and `gateway-darwin-arm64` (Apple Silicon Mac) are available under Assets for tactical command post relays, ground station telemetry, and local development. All release artifacts are signed in `checksums.sha256` (`sha256sum -c checksums.sha256`).

            > [!IMPORTANT]
            > **Target OS for Raspberry Pi 5:** Use **Raspberry Pi OS Lite (64-bit, Debian Bookworm)**. The "Lite" edition is recommended for headless drone payloads because it eliminates desktop/GUI overhead while providing kernel-level hardware drivers for the RP1 southbridge, VideoCore ISP, and Camera Module 3 NoIR (`libcamera`).
          generate_release_notes: false
          draft: false
          prerelease: false
