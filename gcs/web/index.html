<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamboo Node // Swarm Monitor</title>
  <style>
    :root {
      /* Bamboo & Panda Color Theme */
      --bg: #0d120f;
      --card-bg: #141c16;
      --card-border: #1f2d22;
      --card-border-active: #2d4232;
      --text: #f0fdf4;
      --text-muted: #7b9483;
      --bamboo-green: #34d399;
      --bamboo-green-glow: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --red: #f87171;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Minimal Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 18px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--bamboo-green);
      font-family: var(--mono);
      background: var(--bamboo-green-glow);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 1px 7px;
      border-radius: 4px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--bamboo-green);
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bamboo-green);
    }

    .pause-btn {
      background: #1a251e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
    }

    .pause-btn:hover {
      color: #fff;
      border-color: var(--bamboo-green);
    }

    .pause-btn.paused {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--amber);
      color: var(--amber);
      font-weight: bold;
    }

    .stat-text {
      color: var(--text-muted);
    }

    /* Main Stack */
    main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Section 1: Anchored Swarm Cards */
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .node-card.locked {
      border-color: rgba(52, 211, 153, 0.4);
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      font-size: 10px;
      font-family: var(--mono);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .badge-green {
      background: var(--bamboo-green-glow);
      color: var(--bamboo-green);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .badge-amber {
      background: rgba(251, 191, 36, 0.12);
      color: var(--amber);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .badge-red {
      background: rgba(248, 113, 113, 0.12);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .field-label {
      color: var(--text-muted);
    }

    .field-val {
      font-family: var(--mono);
      font-weight: 500;
      color: #fff;
    }

    /* Section 2: Anchored Latest Pulse Inspector */
    .pulse-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 12px;
    }

    .pulse-title {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pulse-data {
      display: flex;
      gap: 16px;
      color: var(--text);
    }

    .pulse-data span {
      color: var(--bamboo-green);
    }

    /* Section 3: Sequence of Events Log */
    .log-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-row {
      display: flex;
      gap: 10px;
      color: var(--text-muted);
    }

    .log-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-node {
      color: var(--bamboo-green);
      font-weight: 600;
      flex-shrink: 0;
    }

    .log-text {
      color: #e2e8f0;
    }

    .log-text.lock {
      color: var(--bamboo-green);
    }

    .log-text.warn {
      color: var(--amber);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">🎋</span>
      <span class="brand-name">Bamboo Node</span>
      <span class="brand-tag">GCS</span>
    </div>
    <div class="header-controls">
      <div class="live-indicator">
        <span class="live-dot" id="live-dot"></span>
        <span id="conn-status">LIVE</span>
      </div>
      <button class="pause-btn" id="pause-btn" onclick="togglePause()">PAUSE</button>
      <div class="stat-text" id="stat-frames">Frames: 0</div>
      <div class="stat-text" id="stat-rate">0.0 Hz</div>
    </div>
  </header>

  <main>
    <!-- Section 1: Active Nodes in The Cupboard -->
    <section>
      <div class="section-label">Active Swarm Nodes</div>
      <div class="node-grid" id="node-grid">
        <div style="color: var(--text-muted); padding: 12px; grid-column: 1/-1;">Waiting for optical frames...</div>
      </div>
    </section>

    <!-- Section 2: Anchored Latest Pulse Inspector -->
    <section>
      <div class="section-label">Latest Decoded Optical Pulse</div>
      <div class="pulse-box">
        <div class="pulse-title">WIRE LINK</div>
        <div class="pulse-data" id="pulse-data">
          <div>NODE: <span id="pulse-node">--</span></div>
          <div>SEQ: <span id="pulse-seq">--</span></div>
          <div>BEARING: <span id="pulse-az">--</span></div>
          <div>CRC-8: <span id="pulse-crc">--</span></div>
        </div>
      </div>
    </section>

    <!-- Section 3: Actionable Sequence of Events -->
    <section>
      <div class="section-label">Sequence of Events Log</div>
      <div class="log-box" id="log-box">
        <div style="color: var(--text-muted);">Awaiting operational state transitions...</div>
      </div>
    </section>
  </main>

  <script>
    let isPaused = false;
    const nodeGrid = document.getElementById('node-grid');
    const logBox = document.getElementById('log-box');
    const statFrames = document.getElementById('stat-frames');
    const statRate = document.getElementById('stat-rate');
    const connStatus = document.getElementById('conn-status');
    const pauseBtn = document.getElementById('pause-btn');

    const pulseNode = document.getElementById('pulse-node');
    const pulseSeq = document.getElementById('pulse-seq');
    const pulseAz = document.getElementById('pulse-az');
    const pulseCrc = document.getElementById('pulse-crc');

    function togglePause() {
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.innerText = 'RESUME';
        pauseBtn.classList.add('paused');
      } else {
        pauseBtn.innerText = 'PAUSE';
        pauseBtn.classList.remove('paused');
      }
    }

    function cleanName(str) {
      return (str || '').replace('MODE_', '').replace('LOCK_', '').replace('_', ' ');
    }

    // In-place node elements cache
    const nodeElements = new Map();

    function updateNodes(activeNodes) {
      if (!activeNodes || activeNodes.length === 0) {
        if (nodeElements.size > 0) {
          nodeGrid.innerHTML = '<div style="color: var(--text-muted); padding: 12px; grid-column: 1/-1;">Waiting for optical frames...</div>';
          nodeElements.clear();
        }
        return;
      }

      const activeIds = new Set(activeNodes.map(n => n.node_id));

      // Remove evicted nodes
      for (const [id, el] of nodeElements.entries()) {
        if (!activeIds.has(id)) {
          el.remove();
          nodeElements.delete(id);
        }
      }

      // If empty state exists, clear it
      if (nodeElements.size === 0) {
        nodeGrid.innerHTML = '';
      }

      // Update or create nodes in-place
      activeNodes.forEach(node => {
        const isLocked = node.lock_status === 'LOCK_HARD_LOCKED';
        let badgeType = 'badge-green';
        if (node.mode === 'MODE_SEARCH') badgeType = 'badge-amber';
        if (node.mode === 'MODE_DISPERSAL') badgeType = 'badge-red';

        const lastSeenSec = ((Date.now() - (node.last_seen_ms || Date.now())) / 1000).toFixed(1);

        if (!nodeElements.has(node.node_id)) {
          // Create once
          const card = document.createElement('div');
          card.className = `node-card ${isLocked ? 'locked' : ''}`;
          card.id = `node-card-${node.node_id}`;
          card.innerHTML = `
            <div class="card-row">
              <span class="node-title">Bamboo Node #${node.node_id}</span>
              <span class="badge ${badgeType}" id="badge-${node.node_id}">${cleanName(node.mode)}</span>
            </div>
            <div class="field-row">
              <span class="field-label">Optical Lock</span>
              <span class="field-val" id="lock-${node.node_id}" style="color: ${isLocked ? 'var(--bamboo-green)' : 'var(--text)'};">${cleanName(node.lock_status)}</span>
            </div>
            <div class="field-row">
              <span class="field-label">Bearing</span>
              <span class="field-val" id="bearing-${node.node_id}">${node.azimuth_mrad || 0} mrad</span>
            </div>
            <div class="field-row">
              <span class="field-label">Sequence</span>
              <span class="field-val" id="seq-${node.node_id}">#${node.sequence_num || 0}</span>
            </div>
            <div class="field-row">
              <span class="field-label">Last Seen</span>
              <span class="field-val" id="seen-${node.node_id}">${lastSeenSec}s ago</span>
            </div>
          `;
          nodeGrid.appendChild(card);
          nodeElements.set(node.node_id, card);
        } else {
          // Update in place without DOM re-layout
          const card = nodeElements.get(node.node_id);
          card.className = `node-card ${isLocked ? 'locked' : ''}`;
          
          const badge = document.getElementById(`badge-${node.node_id}`);
          if (badge) {
            badge.className = `badge ${badgeType}`;
            badge.innerText = cleanName(node.mode);
          }
          const lock = document.getElementById(`lock-${node.node_id}`);
          if (lock) {
            lock.style.color = isLocked ? 'var(--bamboo-green)' : 'var(--text)';
            lock.innerText = cleanName(node.lock_status);
          }
          const bearing = document.getElementById(`bearing-${node.node_id}`);
          if (bearing) bearing.innerText = `${node.azimuth_mrad || 0} mrad`;

          const seq = document.getElementById(`seq-${node.node_id}`);
          if (seq) seq.innerText = `#${node.sequence_num || 0}`;

          const seen = document.getElementById(`seen-${node.node_id}`);
          if (seen) seen.innerText = `${lastSeenSec}s ago`;
        }
      });
    }

    function render(data) {
      if (isPaused) return;

      // 1. Stats
      if (data.stats) {
        statFrames.innerText = `Frames: ${data.stats.total_frames || 0}`;
        statRate.innerText = `${(data.stats.packet_rate_hz || 0).toFixed(1)} Hz`;
      }

      // 2. Active Nodes (In-place)
      updateNodes(data.active_nodes);

      // 3. Anchored Latest Pulse
      if (data.latest_pulse) {
        pulseNode.innerText = `#${data.latest_pulse.node_id}`;
        pulseSeq.innerText = `#${data.latest_pulse.sequence_num}`;
        pulseAz.innerText = `${data.latest_pulse.azimuth_mrad} mrad`;
        pulseCrc.innerText = `0x${(data.latest_pulse.crc8 || 0).toString(16).toUpperCase().padStart(2, '0')} OK`;
      }

      // 4. Actionable Events Log
      if (data.events && data.events.length > 0) {
        logBox.innerHTML = data.events.map(e => {
          let textClass = 'log-text';
          if (e.level === 'LOCK') textClass += ' lock';
          if (e.level === 'WARN') textClass += ' warn';
          return `
            <div class="log-row">
              <span class="log-time">${e.time}</span>
              <span class="log-node">N#${e.node_id}</span>
              <span class="${textClass}">${e.message}</span>
            </div>
          `;
        }).join('');
      }
    }

    // Connect SSE
    function connect() {
      const evt = new EventSource('/events');
      evt.onopen = () => {
        connStatus.innerText = 'LIVE';
        connStatus.style.color = 'var(--bamboo-green)';
      };
      evt.onmessage = (e) => {
        try {
          render(JSON.parse(e.data));
        } catch (err) {}
      };
      evt.onerror = () => {
        connStatus.innerText = 'OFFLINE';
        connStatus.style.color = 'var(--amber)';
      };
    }
    connect();
  </script>
</body>
</html>
