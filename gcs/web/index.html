<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamboo Node // Swarm Monitor</title>
  <style>
    :root {
      /* Bamboo & Panda Color Theme */
      --bg: #101512;
      --card-bg: #171f19;
      --card-border: #233027;
      --text: #f0fdf4;
      --text-muted: #869e8f;
      --bamboo-green: #34d399;
      --bamboo-dark: #064e3b;
      --bamboo-light: #d1fae5;
      --amber: #fbbf24;
      --red: #f87171;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* Minimal Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 20px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--bamboo-green);
      font-family: var(--mono);
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--bamboo-green);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bamboo-green);
    }

    .stat-text {
      color: var(--text-muted);
    }

    /* Main Grid: 2 Clean Sections */
    main {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Active Nodes Section */
    .node-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .node-card.locked {
      border-color: var(--bamboo-green);
    }

    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .node-badge {
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(52, 211, 153, 0.15);
      color: var(--bamboo-green);
    }

    .node-badge.amber {
      background: rgba(251, 191, 36, 0.15);
      color: var(--amber);
    }

    .node-badge.red {
      background: rgba(248, 113, 113, 0.15);
      color: var(--red);
    }

    .node-detail {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-val {
      font-family: var(--mono);
      font-weight: 500;
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Packet Stream Console */
    .stream-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
    }

    .stream-console {
      font-family: var(--mono);
      font-size: 12px;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stream-row {
      display: flex;
      gap: 12px;
      color: var(--text-muted);
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stream-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .stream-node {
      color: var(--bamboo-green);
      font-weight: 600;
      flex-shrink: 0;
    }

    .stream-summary {
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">🎋</span>
      <span class="brand-name">Bamboo Node</span>
      <span class="brand-tag">GCS MONITOR</span>
    </div>
    <div class="header-status">
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="conn-status">LIVE STREAM</span>
      </div>
      <div class="stat-text" id="stat-frames">Frames: 0</div>
      <div class="stat-text" id="stat-rate">0.0 Hz</div>
    </div>
  </header>

  <main>
    <!-- Section 1: Detected Bamboo Nodes -->
    <section>
      <div class="section-title">Active Swarm Nodes</div>
      <div class="node-list" id="node-list">
        <div class="empty-state">Waiting for optical pulse frames...</div>
      </div>
    </section>

    <!-- Section 2: Simple Decoded Packet Feed -->
    <section>
      <div class="section-title">Decoded Optical Packets</div>
      <div class="stream-container">
        <div class="stream-console" id="stream-console">
          <div style="color: var(--text-muted);">No packets received yet.</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const nodeList = document.getElementById('node-list');
    const streamConsole = document.getElementById('stream-console');
    const statFrames = document.getElementById('stat-frames');
    const statRate = document.getElementById('stat-rate');
    const connStatus = document.getElementById('conn-status');

    function cleanName(str) {
      return (str || '').replace('MODE_', '').replace('LOCK_', '').replace('_', ' ');
    }

    function render(data) {
      // 1. Stats
      if (data.stats) {
        statFrames.innerText = `Frames: ${data.stats.total_frames || 0}`;
        statRate.innerText = `${(data.stats.packet_rate_hz || 0).toFixed(1)} Hz`;
      }

      // 2. Active Nodes
      if (!data.active_nodes || data.active_nodes.length === 0) {
        nodeList.innerHTML = '<div class="empty-state">Waiting for optical pulse frames...</div>';
      } else {
        nodeList.innerHTML = data.active_nodes.map(node => {
          const isLocked = node.lock_status === 'LOCK_HARD_LOCKED';
          let badgeClass = 'node-badge';
          if (node.mode === 'MODE_SEARCH') badgeClass += ' amber';
          if (node.mode === 'MODE_DISPERSAL') badgeClass += ' red';

          const lastSeenSec = ((Date.now() - (node.last_seen_ms || Date.now())) / 1000).toFixed(1);

          return `
            <div class="node-card ${isLocked ? 'locked' : ''}">
              <div class="node-top">
                <span class="node-title">Bamboo Node #${node.node_id}</span>
                <span class="${badgeClass}">${cleanName(node.mode)}</span>
              </div>
              <div class="node-detail">
                <span class="detail-label">Optical Lock</span>
                <span class="detail-val" style="color: ${isLocked ? 'var(--bamboo-green)' : 'var(--text)'};">
                  ${cleanName(node.lock_status)}
                </span>
              </div>
              <div class="node-detail">
                <span class="detail-label">Azimuth Bearing</span>
                <span class="detail-val">${node.azimuth_mrad || 0} mrad</span>
              </div>
              <div class="node-detail">
                <span class="detail-label">Packet Sequence</span>
                <span class="detail-val">#${node.sequence_num || 0} (CRC 0x${(node.crc8 || 0).toString(16).toUpperCase().padStart(2, '0')})</span>
              </div>
              <div class="node-detail">
                <span class="detail-label">Last Seen</span>
                <span class="detail-val">${lastSeenSec}s ago</span>
              </div>
            </div>
          `;
        }).join('');
      }

      // 3. Simple Packet Stream
      if (data.recent_packets && data.recent_packets.length > 0) {
        streamConsole.innerHTML = data.recent_packets.slice(0, 15).map(pkt => `
          <div class="stream-row">
            <span class="stream-time">${pkt.time || ''}</span>
            <span class="stream-node">Node ${pkt.node_id}</span>
            <span class="stream-summary">${pkt.summary || ''}</span>
          </div>
        `).join('');
      }
    }

    // Connect Server-Sent Events
    function connect() {
      const evt = new EventSource('/events');
      evt.onopen = () => {
        connStatus.innerText = 'LIVE STREAM';
        connStatus.style.color = 'var(--bamboo-green)';
      };
      evt.onmessage = (e) => {
        try {
          render(JSON.parse(e.data));
        } catch (err) {}
      };
      evt.onerror = () => {
        connStatus.innerText = 'CONNECTING...';
        connStatus.style.color = 'var(--amber)';
      };
    }
    connect();
  </script>
</body>
</html>
